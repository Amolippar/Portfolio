services:
  - type: web
    name: amol-portfolio-backend
    runtime: docker
    dockerfilePath: portfolio-backend/Dockerfile
    dockerContext: portfolio-backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"

  - type: web
    name: amol-portfolio-frontend
    runtime: static
    buildCommand: cd portfolio-frontend && npm install && npm run build
    staticPublishPath: portfolio-frontend/dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: amol-portfolio-backend
          property: host
