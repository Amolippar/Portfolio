name: Full-Stack CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-frontend:
    name: Build & Verify React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'portfolio-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./portfolio-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./portfolio-frontend
        run: npm run build

  build-backend:
    name: Build & Package Spring Boot Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./portfolio-backend
        run: mvn clean package -DskipTests
